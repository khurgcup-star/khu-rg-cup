<!doctype html>
<html lang="ko">

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="soft-page">
    <header class="topbar light">
      <a class="logo" href="index.html" aria-label="홈으로 이동">
        <span class="logo-text">KHU CUP</span>
        <span class="logo-sub">Lions Cup RG</span>
      </a>
      <nav class="desktop-nav" aria-label="주요 메뉴">
        <a href="index.html">대회 안내</a>
        <a href="schedule.html">일정표</a>
        <a href="apply.html">신규 신청</a>
        <a class="active" href="check.html">신청 확인</a>
        <a href="directions.html">오시는 길</a>
      </nav>
      <button class="menu-button" type="button" data-mobile-menu-button aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </header>

    <nav class="mobile-nav" data-mobile-menu aria-label="모바일 메뉴">
      <a href="index.html">대회 안내</a>
      <a href="schedule.html">일정표</a>
      <a href="apply.html">신규 신청</a>
      <a href="check.html">신청 확인</a>
      <a href="directions.html">오시는 길</a>
    </nav>

    <main class="check-shell">
      <div class="mode-tabs" role="tablist" aria-label="신청 메뉴">
        <a href="apply.html">신규 신청</a>
        <a class="selected" href="check.html">신청 확인</a>
        <a href="directions.html">오시는 길</a>
      </div>

      <section class="check-card">
        <h1>신청 내역 조회</h1>
        <form class="lookup-row" data-lookup-form>
          <input name="email" type="email" placeholder="이메일" aria-label="이메일" required />
          <button class="btn primary" type="submit">조회</button>
        </form>
        <p class="helper">신청할 때 입력한 이메일로 조회할 수 있습니다.</p>
        <div class="lookup-results" data-lookup-results></div>
      </section>

      <section class="contact-cta">
        <h2>대회 관련 문의</h2>
        <p>대회 참가에 대해 궁금한 점이 있으시면 운영사무국으로 연락해주세요.</p>
        <a class="btn dark" href="mailto:rg@khu-presidentcup.kr">문의하기</a>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
